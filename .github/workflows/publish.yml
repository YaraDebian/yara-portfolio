name: Publish from Notion

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check Notion for edits in the last hour
        id: check
        if: github.event_name == 'schedule'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: echo "status=$(node scripts/notion-changed.mjs)" >> "$GITHUB_OUTPUT"
      - name: Trigger deploy
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.status == 'changed'
        run: curl -fsS -X POST "${{ secrets.DEPLOY_HOOK }}"
